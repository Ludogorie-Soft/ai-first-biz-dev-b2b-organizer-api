services:
  api:
    image: ludogoriesoft/b2b-organizer-api:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: ludogoriesoft/b2b-organizer-frontend:latest
    environment:
      INTERNAL_API_URL: http://api:3000/api
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: unless-stopped
